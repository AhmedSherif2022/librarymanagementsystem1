spring.application.name=library-management-system


spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/library}
spring.datasource.username=${DB_USER:library}
spring.datasource.password=${DB_PASSWORD:library}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.flyway.enabled=false


spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true


jwt.secret=${JWT_SECRET}
jwt.validity=${JWT_VALIDITY:3600}

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# Admin account made (or promoted) on startup. Leave ADMIN_USERNAME empty to skip.
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.email=${ADMIN_EMAIL:}
